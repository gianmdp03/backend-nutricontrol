spring.application.name=nutricontrol
spring.config.import=optional:classpath:secrets.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/nutricontrol
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
nutricontrol.appointments.days=25
nutricontrol.appointments.minutes-gap=20
nutricontrol.appointments.duration-minutes=15
logging.file.name=logs/nutricontrol-app.log
logging.logback.rollingpolicy.file-name-pattern=logs/nutricontrol-app-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=15
logging.logback.rollingpolicy.total-size-cap=1GB
server.forward-headers-strategy=framework
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false